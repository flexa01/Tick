<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ADOŞŞ ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#2d0202; /* Şarap Kırmızısı Arka Plan */
  --pink:#ff4f88;
  --pink2:#ff85ac;
  --gold:#f0c86e;
  --white:#fff7f0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  font-family:'Cormorant Garamond',serif;
  color:white;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
  radial-gradient(circle at 20% 20%, rgba(255,70,120,.18), transparent 30%),
  radial-gradient(circle at 80% 30%, rgba(255,180,100,.15), transparent 35%),
  radial-gradient(circle at 50% 90%, rgba(255,40,90,.13), transparent 40%);
  z-index:0;
}

canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}

/* FOTOĞRAFLAR - Katman ve Netlik Ayarı */
.photo{
  position:fixed;
  width:185px;
  height:240px;
  border-radius:24px;
  overflow:hidden;
  z-index:2; /* Yazı kartının (10) altında kalması için düşük tutuldu */
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1);
  box-shadow: 0 15px 40px rgba(0,0,0,.45);
  transition:.45s;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  image-rendering: auto;
}

/* FOTOĞRAF KONUMLARI */
.p1{ top:25px; left:25px; transform:rotate(-7deg); }
.p2{ top:25px; right:25px; transform:rotate(7deg); }
.p3{ bottom:25px; left:25px; transform:rotate(6deg); }
.p4{ bottom:25px; right:25px; transform:rotate(-6deg); }

/* MERKEZ KART - En Üst Katman */
.center{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:min(540px, 92vw);
  z-index:10; /* Fotoğrafların üstüne çıkması için en yüksek değer */
}

.card{
  position:relative;
  overflow:hidden;
  border-radius:34px;
  padding:44px 30px;
  background:rgba(0, 0, 0, 0.4); /* Mobilde okunurluk için hafif karartıldı */
  border:1px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  text-align:center;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}

.heart{
  font-size:60px;
  margin-bottom:10px;
  animation:beat 1.7s infinite;
  filter:drop-shadow(0 0 18px rgba(255,70,120,.8));
}

@keyframes beat{
  0%{transform:scale(1);}
  15%{transform:scale(1.15);}
  30%{transform:scale(1);}
  45%{transform:scale(1.1);}
  100%{transform:scale(1);}
}

.title{
  font-size:3rem;
  font-family:'Playfair Display',serif;
  background: linear-gradient(135deg,var(--gold),white,var(--pink2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:10px;
}

.names{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
  font-family:'Playfair Display',serif;
  font-size: 1.8rem;
}

.line{
  width:100%;
  height:1px;
  margin:24px 0;
  background: linear-gradient(to right, transparent, rgba(255,255,255,.45), transparent);
}

.text{
  font-size:1.2rem;
  line-height:1.9;
  color:rgba(255,255,255,.9);
}

.hl{ color:var(--pink2); font-weight: bold; }

/* MOBİL DÜZENLEME - Çakışmayı Önleyen Kısım */
@media(max-width:700px){
  .photo{
    width:28vw; /* Biraz küçültüldü */
    height:36vw;
    z-index: 1; /* Kesinlikle kartın altında kalacak */
  }

  /* Mobilde fotoları iyice köşelere itiyoruz */
  .p1{ top:10px; left:5px; }
  .p2{ top:10px; right:5px; }
  .p3{ bottom:10px; left:5px; }
  .p4{ bottom:10px; right:5px; }

  .title{ font-size:2.2rem; }
  .text{ font-size:1rem; line-height: 1.6; }
  .card{ padding:30px 15px; }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="photo p1"><img src="foto1.png"></div>
<div class="photo p2"><img src="foto2.png"></div>
<div class="photo p3"><img src="foto3.png"></div>
<div class="photo p4"><img src="foto4.png"></div>

<div class="center">
  <div class="card">
    <div class="heart">❤️</div>
    <div class="title">ADOŞŞ</div>
    <div class="names">
      <span>ONUR</span>
      <span>❤️</span>
      <span>ADA</span>
    </div>
    <div class="line"></div>
    <div class="text">
      Sen benim en derin duygum, en güzel gerçeğimsin.<br>
      Gözlerinle ruhuma dokunduğun her an, dünyanın bütün anlamı <span class="hl">sende toplanıyor.</span><br><br>
      Yanında olmak, seni sevmek...<br>
      Bu hayattaki <span class="hl">en büyük şansım.</span>
    </div>
    <div style="margin-top:25px; font-size:.7rem; letter-spacing:.3em; color:rgba(255,255,255,.3);">
      ✦ SENİ ÇOK SEVİYORUM ✦
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
let w,h;

function resize(){
  w=canvas.width=innerWidth;
  h=canvas.height=innerHeight;
}
resize();
addEventListener('resize',resize);

class Particle{
  constructor(){ this.reset(); }
  reset(){
    this.x=Math.random()*w;
    this.y=Math.random()*h;
    this.r=Math.random()*2.5+.5;
    this.a=Math.random()*.6+.2;
    this.vy=Math.random()*-.7-.2;
  }
  update(){
    this.y+=this.vy;
    if(this.y<-10){
      this.y=h+10;
      this.x=Math.random()*w;
    }
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${this.a})`;
    ctx.fill();
  }
}

const particles=[];
for(let i=0;i<130;i++){ particles.push(new Particle()); }

let hearts=[];
function spawnHearts(x,y){
  for(let i=0;i<8;i++){
    hearts.push({
      x:x, y:y,
      vx:(Math.random()-.5)*4,
      vy:-(Math.random()*3+2),
      life:1,
      size:Math.random()*20+15
    });
  }
}

addEventListener('mousedown',e=>spawnHearts(e.clientX,e.clientY));
addEventListener('touchstart',e=>{
  spawnHearts(e.touches[0].clientX,e.touches[0].clientY);
},{passive:true});

function animate(){
  requestAnimationFrame(animate);
  ctx.clearRect(0,0,w,h);
  particles.forEach(p=>{ p.update(); p.draw(); });
  hearts.forEach((hh, i)=>{
    ctx.globalAlpha=hh.life;
    ctx.font=`${hh.size}px serif`;
    ctx.fillText('💗',hh.x,hh.y);
    hh.x+=hh.vx;
    hh.y+=hh.vy;
    hh.life-=0.02;
    if(hh.life<=0) hearts.splice(i,1);
  });
}
animate();
</script>
</body>
</html>
